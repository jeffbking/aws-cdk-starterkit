name: Runner preflight
on:
  push:
    branches: [main, github-actions/all-actions-5900xt]
    paths:
      - .github/workflows/**
      - ops/ci-runner/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-runner:
    runs-on: [self-hosted, Linux, X64, 5900xt-aws-cdk-starterkit-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify runner identity and tools
        shell: bash
        run: |
          [[ "$RUNNER_NAME" == "5900xt-aws-cdk-starterkit-ci-"* ]]
          test "$(id -u)" != 0
          node --version
          npm --version
          git --version
          gh --version
          jq --version
          test ! -e /var/run/docker.sock
          test ! -e /home/jeff
